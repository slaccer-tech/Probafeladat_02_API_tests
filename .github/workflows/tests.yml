name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Naponta egyszer, hogy a külső API esetleges változásait is elkapjuk
    - cron: '0 6 * * *'

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        run: npm install

      - name: Tesztek futtatása (Newman)
        run: npm test
